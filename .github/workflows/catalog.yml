name: Catalog index
on:
  push:
    branches: [catalog]
  pull_request:
    branches: [catalog]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python marketplace/validate.py
      - run: python -m unittest discover -s marketplace/tests
      - name: Runtime metadata is valid JSON
        run: |
          python - <<'PYTHON'
          import json, pathlib
          for path in pathlib.Path('desktop/catalog').rglob('*.json'):
              json.loads(path.read_text())
          PYTHON
